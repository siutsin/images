name: Test

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/**'
      - '**/*.md'
      - '.markdownlint.json'
      - '.yamllint'
      - 'images/**'
      - 'Makefile'
  pull_request:
    branches:
      - master
    paths:
      - '.github/workflows/**'
      - '**/*.md'
      - '.markdownlint.json'
      - '.yamllint'
      - 'images/**'
      - 'Makefile'

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2

      - name: Run tests
        run: make test
