name: Test

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/**'
      - '**/*.md'
      - '.markdownlint.json'
      - '.yamllint'
      - 'images/**'
      - 'Makefile'
  pull_request:
    branches:
      - master
    paths:
      - '.github/workflows/**'
      - '**/*.md'
      - '.markdownlint.json'
      - '.yamllint'
      - 'images/**'
      - 'Makefile'

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5

      - name: Run tests
        run: make test
